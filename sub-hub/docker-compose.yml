services:
  sub-hub:
    build:
      context: .
      args:
        SUBCONVERTER_VERSION: "0.9.0"
    image: sub-hub:latest
    container_name: sub-hub
    restart: unless-stopped

    ports:
      - "${PORT:-8787}:8787"

    environment:
      # Bootstrap token. Imported on first run when the SQLite database is empty.
      MASTER_TOKEN: "${MASTER_TOKEN:-change-me-please}"
      PORT: "8787"
      DB_PATH: "/data/sub-hub.db"
      NODES_FILE: "/data/nodes.txt"
      SUBCONVERTER_URL: "http://127.0.0.1:25500"
      LOG_MAX_RECORDS: "1000"

    volumes:
      - ./data:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
